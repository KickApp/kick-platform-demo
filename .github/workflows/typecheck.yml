name: Typecheck

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: typecheck-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
